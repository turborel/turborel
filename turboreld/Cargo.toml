[package]
name = "turboreld"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
description = "turboreld, the turborel server's program: a daemon serving a database, configured by its settings (RULES.md D42)."
# The test target is declared below, in `test/`.
autotests = false

[dependencies]
turborel = { path = ".." }
turborel-server = { path = "../server" }
# Compression for the database's files and tables (RULES.md D48).
turborel-lz4 = { path = "../lz4" }
# Encryption for the database's files and tables, its keys from a
# directory the operator keeps (RULES.md D26, D48).
turborel-aes = { path = "../aes" }
# A password typed at a terminal without its echo (RULES.md D46), as the
# command-line client reads one.
rpassword = "=7.5.4"
# The program's runtime and its signals (RULES.md D42).
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "signal"] }

[dev-dependencies]
turborel-client = { path = "../client" }
turborel-test-support = { path = "../support", features = ["client"] }

[lints]
workspace = true

# Its command line and its run, as a library, so tests reach all of it.
[lib]
path = "src/lib.rs"

# The program: `turboreld --help`. Its documentation is the library's.
[[bin]]
name = "turboreld"
path = "src/main.rs"
doc = false

# ONE integration test binary (RULES.md D5).
[[test]]
name = "turboreld"
path = "test/main.rs"
