[package]
name = "turboreld"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
description = "turboreld, the turborel server's program: a daemon serving a database, configured by its settings (RULES.md D42)."
license = "BSD-2-Clause-Patent"
repository = "https://github.com/turborel/turborel"
readme = "../README.md"
keywords = ["database", "sql", "server", "daemon", "turborel"]
categories = ["database-implementations", "command-line-utilities"]
# The test target is declared below, in `test/`.
autotests = false

[dependencies]
turborel = { version = "0.0.0", path = ".." }
turborel-server = { version = "0.0.0", path = "../server" }
# Compression for the database's files and tables (RULES.md D48).
turborel-lz4 = { version = "0.0.0", path = "../lz4" }
# The kernels on vector instructions, XXH3's loops among them (RULES.md
# D460).
turborel-simd = { version = "0.0.0", path = "../simd" }
# Encryption for the database's files and tables, its keys from a
# directory the operator keeps, and cryptographic checksums (RULES.md D26,
# D48).
turborel-aes = { version = "0.0.0", path = "../aes" }
# A password typed at a terminal without its echo (RULES.md D46), as the
# command-line client reads one.
rpassword = "=7.5.4"
# The program's runtime and its signals (RULES.md D42).
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "signal"] }
# Allocators an operator may build the program on, one feature each;
# by default it allocates through the system's (RULES.md D765). The
# library crates never set one.
mimalloc = { version = "=0.1.52", optional = true }
snmalloc-rs = { version = "=0.7.6", optional = true, default-features = false, features = ["build_cc"] }
rpmalloc = { version = "=0.2.2", optional = true }

[features]
# The system's allocator: none of the features below.
default = []
# At most one of these, the program's global allocator (RULES.md D765).
mimalloc = ["dep:mimalloc"]
snmalloc = ["dep:snmalloc-rs"]
rpmalloc = ["dep:rpmalloc"]

[dev-dependencies]
turborel-client = { version = "0.0.0", path = "../client", features = ["tls", "scram"] }
turborel-test-support = { path = "../support", features = ["tls"] }

[lints]
workspace = true

# Its command line and its run, as a library, so tests reach all of it.
[lib]
path = "src/lib.rs"

# The program: `turboreld --help`. Its documentation is the library's.
[[bin]]
name = "turboreld"
path = "src/main.rs"
doc = false

# ONE integration test binary (RULES.md D5).
[[test]]
name = "turboreld"
path = "test/main.rs"
