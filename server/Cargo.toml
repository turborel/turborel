[package]
name = "turborel-server"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
description = "The turborel server, as a library: the database's sessions over a network, for many clients at once, in any program that serves it (RULES.md D42). Its program is `turboreld`."
# The test target is declared below, in `test/`.
autotests = false

[dependencies]
turborel = { path = ".." }
turborel-protocol = { path = "../protocol" }
# Network I/O only (RULES.md D42); statements run on the blocking pool.
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
# TLS (RULES.md D26, D42): rustls, its cryptography from aws-lc-rs only.
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
# Passwords (RULES.md D26, D43): PBKDF2-HMAC-SHA256 and randomness, from
# the same aws-lc-rs as TLS's.
aws-lc-rs = { version = "=1.18.2", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }

[dev-dependencies]
turborel-client = { path = "../client", features = ["tls"] }
turborel-test-support = { path = "../support", features = ["tls"] }

[lints]
workspace = true

# ONE integration test binary (RULES.md D5).
[[test]]
name = "server"
path = "test/main.rs"
