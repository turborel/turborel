# Kinds
- name: "bug"
  color: "#d73a4a"
  description: "Something fails, crashes, loses data or returns a wrong result"
- name: "conformance"
  color: "#5c282b"
  description: "A departure from a rule of the SQL standard"
- name: "performance"
  color: "#fbca04"
  description: "Slower than it was or should be, or too much memory or disk"
- name: "feature"
  color: "#a2eeef"
  description: "Something turborel should do that it does not"
- name: "documentation"
  color: "#0075ca"
  description: "Improvements or additions to documentation"

# Impact
- name: "impact/data-loss"
  color: "#b60205"
  description: "Data lost or damaged, or a database that will not open"
- name: "impact/wrong-result"
  color: "#b60205"
  description: "A wrong result"
- name: "impact/crash"
  color: "#b60205"
  description: "A crash, abort or hang"
- name: "impact/regression"
  color: "#b60205"
  description: "Worked, or was faster, at an earlier commit"

