# Every check a change must pass (RULES.md R-PROC-1), on each platform the tool
# claims to run on, plus structural coverage (R-COV). The toolchain comes from
# rust-toolchain.toml (R-CM-1): `rustup toolchain install` with no argument
# installs that active toolchain.
name: verify

# A pull request is checked once, through pull_request, and main again once
# it is merged. Pushing a branch with an open pull request starts no second
# set of the same checks. A branch with no pull request is checked on demand
# through workflow_dispatch (`gh workflow run verify.yml --ref BRANCH`).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a branch or a pull request replaces its checks still
# running, so only the latest commit is checked.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Every check
        timeout-minutes: 90
        run: cargo xtask verify

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Structural coverage
        run: cargo xtask coverage
