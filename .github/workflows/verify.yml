# Every check a change must pass (RULES.md R-PROC-1), on each platform the tool
# claims to run on, plus structural coverage (R-COV). The toolchain comes from
# rust-toolchain.toml (R-CM-1): `rustup toolchain install` with no argument
# installs that active toolchain.
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # Temporary: the test runs past a minute on Windows alone; its output
      # says where it stops. Removed once it is understood.
      - name: Where the timeouts test stops on Windows
        if: runner.os == 'Windows'
        # Twenty minutes: the first cargo run of the job compiles the test.
        timeout-minutes: 20
        continue-on-error: true
        run: cargo test -p turborel-server --test server -- timeouts::a_client_waits_as_its_timeouts_say --nocapture
      - name: Every check
        timeout-minutes: 90
        run: cargo xtask verify

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Structural coverage
        run: cargo xtask coverage
