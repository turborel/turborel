# Every check a change must pass (RULES.md R-PROC-1), on each platform the tool
# claims to run on, plus structural coverage (R-COV). The toolchain comes from
# rust-toolchain.toml (R-CM-1): `rustup toolchain install` with no argument
# installs that active toolchain.
name: verify

# A pull request is checked once, through pull_request, and main again once
# it is merged. Pushing a branch with an open pull request starts no second
# set of the same checks.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces its checks still running. On main
# every merge is checked to the end, since the nightly build waits on it.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Every check
        timeout-minutes: 90
        run: cargo xtask verify

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Structural coverage
        run: cargo xtask coverage
