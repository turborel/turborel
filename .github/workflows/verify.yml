name: verify
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Build the server and the client
        env:
          RUSTFLAGS: ""
        run: cargo build --release --locked -p turboreld -p turborel-cli
      - uses: actions/upload-artifact@v4
        with:
          name: built
          path: |
            target/release/turboreld
            target/release/turborel
          retention-days: 1
