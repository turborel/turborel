[package]
name = "turborel-client"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
description = "A client of the turborel server: a blocking connection over its wire protocol (RULES.md D42). No dependencies beyond the standard library and turborel's, but for TLS with the feature `tls`, the platform's certificate authorities with `system-roots`, and SCRAM-SHA-256 with the feature `scram`."
license = "BSD-2-Clause"
repository = "https://github.com/turborel/turborel"
readme = "../README.md"
keywords = ["database", "sql", "client", "turborel"]
categories = ["database", "network-programming"]
autotests = false

[dependencies]
turborel = { version = "0.0.0", path = ".." }
turborel-protocol = { version = "0.0.0", path = "../protocol" }
# TLS (RULES.md D26, D42), only with the feature `tls`: without it, the
# client has no dependency beyond the standard library and turborel, but
# for SCRAM-SHA-256 with the feature `scram`.
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"], optional = true }
# The platform's certificate authorities (RULES.md D26), only with the
# feature `system-roots`.
rustls-native-certs = { version = "=0.8.5", optional = true }

[features]
tls = ["dep:rustls"]
# Trusting the platform's certificate authorities too, when asked
# (`tls::roots`): rustls-native-certs.
system-roots = ["tls", "dep:rustls-native-certs"]
# SCRAM-SHA-256 (RULES.md D43): its cryptography from the aws-lc-rs of
# TLS, through the protocol's feature `scram`.
scram = ["turborel-protocol/scram"]

[lints]
workspace = true

# Its tests against a server are the server's (server/test), which has both.
