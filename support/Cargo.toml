[package]
name = "turborel-test-support"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Fixtures shared by the tests of turborel's crates (RULES.md R-TEST-10). Not part of the product."
publish = false

[dependencies]
# Helpers for a client's results, with the feature `client`; a server to
# connect to, with `server`; certificates for it, with `tls`. Without them the crate has no dependency, so
# the core's own tests may use it.
turborel = { path = "..", optional = true }
turborel-client = { path = "../client", optional = true }
turborel-protocol = { path = "../protocol", optional = true }
turborel-server = { path = "../server", optional = true }
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "sync"], optional = true }
# Certificates made for each test run, so none expires in the repository:
# with the feature `tls`.
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"], optional = true }

[features]
client = ["dep:turborel-client"]
server = ["client", "dep:turborel", "dep:turborel-protocol", "dep:turborel-server", "dep:tokio"]
tls = ["server", "dep:rcgen"]

[lints]
workspace = true
